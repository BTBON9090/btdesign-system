name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test packages, API and migration audit
        run: npm test
      - name: Build packages and documentation
        run: npm run build
      - name: Check hosting API entry points
        run: npm exec -- tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 --strict --skipLibCheck --types node api/generate.ts api/health.ts api/compose.ts cloud-functions/api/health.ts cloud-functions/api/generate.ts cloud-functions/api/compose.ts
      - name: Verify distributable packages
        run: node scripts/verify-packages.mjs --skip-pack
